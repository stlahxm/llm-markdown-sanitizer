name: Java CI

on:
  push:
    branches: [main]
    paths: ["java/**", ".github/workflows/java-ci.yml"]
  pull_request:
    paths: ["java/**", ".github/workflows/java-ci.yml"]

defaults:
  run:
    working-directory: java

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: gradle build
